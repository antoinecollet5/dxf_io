name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  UV_NO_PROGRESS: 1

jobs:
  lint:
    name: Lint (ruff, ty, codespell, rustfmt, clippy) and Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned so that new clippy lints (every Rust release) don't break CI
          # unexpectedly: bump it deliberately and fix the new warnings.
          toolchain: "1.100"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] CI only; releases build without caches
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the project and the dev tools
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --python "$PYTHON"

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: ty
        run: uv run --no-sync ty check --output-format=github

      - name: codespell
        run: uv run --no-sync codespell python tests src docs/sources README.rst CHANGELOG.md CONTRIBUTING.md

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          export LD_LIBRARY_PATH="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --release

  docs:
    name: Documentation (Sphinx, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the documentation dependencies
        run: |
          uv venv --python 3.13
          uv pip install --group docs

      - name: Build the documentation
        run: uv run --no-sync python -m sphinx -W --keep-going -b html docs/sources docs/build/html

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14", "3.15", "3.15t"]
        include:
          # Intel macOS and Windows ARM64: newest Python only.
          - os: macos-15-intel
            python: "3.15"
          - os: windows-11-arm
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] CI only; releases build without caches
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build and install (editable, release mode)
        shell: bash
        run: |
          uv venv --managed-python --python "${{ matrix.python }}"
          uv pip install --only-binary numpy -e . --group test

      - name: Install PyVista (optional, when available for this Python / platform)
        shell: bash
        run: uv pip install --only-binary vtk pyvista || echo "::notice::PyVista not available, its tests are skipped"

      - name: Run tests
        shell: bash
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}.${{ matrix.python }}
        run: uv run --no-sync pytest --cov=dxf_io --cov-config=.coveragerc --cov-report=term --color=yes

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.${{ matrix.os }}.${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Combine coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-data

      - name: Combine coverage
        run: |
          uvx coverage combine --rcfile=.coveragerc coverage-data/.coverage.*
          uvx coverage report --rcfile=.coveragerc -m
          uvx coverage xml --rcfile=.coveragerc

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
