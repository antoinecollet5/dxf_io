# Hooks use the tools installed in the project environment (`uv sync`).
repos:
- repo: local
  hooks:
  - id: check-json
    name: check json
    entry: check-json
    language: system
    types: [json]

  - id: check-toml
    name: check toml
    entry: check-toml
    language: system
    types: [toml]

  - id: check-yaml
    name: check yaml
    entry: check-yaml
    language: system
    types: [yaml]

  - id: end-of-file-fixer
    name: fix end of files
    entry: end-of-file-fixer
    language: system
    types: [text]
    stages: [pre-commit, pre-push, manual]

  - id: trailing-whitespace
    name: trim trailing whitespace
    entry: trailing-whitespace-fixer
    language: system
    types: [text]
    stages: [pre-commit, pre-push, manual]

  - id: codespell
    name: codespell
    entry: codespell
    language: system
    types_or: [python, rst, markdown, rust]

  - id: ruff-check
    name: ruff check
    entry: ruff check
    language: system
    types_or: [python, pyi]
    args: [--fix, --exit-non-zero-on-fix]

  - id: ruff-format
    name: ruff format
    entry: ruff format
    language: system
    types_or: [python, pyi]

  - id: ty
    name: ty check
    entry: ty check
    language: system
    types_or: [python, pyi]
    pass_filenames: false

  - id: cargo-fmt
    name: cargo fmt
    entry: cargo fmt --
    language: system
    types: [rust]

  - id: cargo-clippy
    name: cargo clippy
    entry: cargo clippy --all-targets -- -D warnings
    language: system
    types: [rust]
    pass_filenames: false
