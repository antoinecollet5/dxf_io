[package]
name = "dxf_io"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.16"
rustc-hash = "2.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "_dxf_io"
crate-type = ["cdylib"]
